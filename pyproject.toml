[project]
name = "meerkat-beams"
version = "0.0.0"
description = "MeerKAT beam interpolator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "landmanbester", email = "lbester@sarao.ac.za" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "hip-cargo >= 0.2.0",
]

[project.optional-dependencies]
# Full scientific stack
full = [
    "xarray",
    "xarray-fits",
    "zarr<3",
    "numcodecs",
    "astropy",
    "numpy",
    "scipy",
    "matplotlib",
    "wget",
    "gdown>=5.0.0",
    "requests>=2.33.1",
    "dask-ms[s3,xarray,zarr]>=0.2.23",
]

[project.urls]
Homepage = "https://github.com/landmanbester/meerkat-beams"
Repository = "https://github.com/landmanbester/meerkat-beams"
"Bug Tracker" = "https://github.com/landmanbester/meerkat-beams/issues"

[project.scripts]
mbeams = "meerkat_beams.cli:app"

[build-system]
# NOTE: This uv_build constraint is intentionally aligned with hip-cargo's own pyproject.toml.
# If you bump uv_build in hip-cargo, update this template constraint to match.
requires = ["uv_build>=0.8.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E741", "N806"]  # domain-specific names: l/m coords, Stokes I, S/Sinv matrices

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take more time to run",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "tbump>=6.11.0",
    "pre-commit>=4.0.0",
    "mypy>=1.0.0",
    "ipdb",
]
test = [
    "pytest>=8.0.0",
]
