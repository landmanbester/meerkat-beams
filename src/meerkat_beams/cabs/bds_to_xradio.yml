cabs:
  bds_to_xradio:
    flavour: python
    command: meerkat_beams.core.bds_to_xradio.bds_to_xradio
    name: bds_to_xradio
    info:
      Renders a beam dataset (BDS) to an xradio-compatible zarr image
    image: ghcr.io/landmanbester/meerkat-beams:dev001
    inputs:
      bds-path:
        info:
          input beam dataset (.bds.zarr)
        dtype: Directory
        required: true
        policies:
          positional: true
        metavar: BDS_PATH
      image-path:
        info:
          image/dataset for WCS and time info
        dtype: Directory
        required: true
        policies:
          positional: true
        metavar: IMAGE_PATH
      output-var:
        info:
          name of the output data variable
        default: SKY
      pixel-stepping:
        info:
          compute every Nth pixel, interpolate back
        dtype: int
        default: 4
      time-stepping:
        info:
          use every Nth timeslot
        dtype: int
        default: 1
      num-freq:
        info:
          number of frequency channels (default uses beam dataset freqs)
        dtype: Optional[int]
      chunks-time:
        info:
          zarr chunk size along time axis
        dtype: int
        default: 1
      chunks-freq:
        info:
          zarr chunk size along frequency axis
        dtype: Optional[int]
      chunks-x:
        info:
          zarr chunk size along l axis
        dtype: int
        default: 256
      chunks-y:
        info:
          zarr chunk size along m axis
        dtype: int
        default: 256
      elements:
        info:
          Jones/Mueller elements to render (e.g.
          II, QQ for Stokes; XX, YY for Jones)
        dtype: Optional[List[str]]
      output-pol:
        info:
          'output polarization labels for each element (default: auto)'
        dtype: Optional[List[str]]
      beam-type:
        info:
          beam variable to use (nstokes, stokes, njones, jones)
        default: nstokes
      compress:
        info:
          apply Delta+Blosc compression to zarr output
        dtype: bool
        default: false
    outputs:
      output:
        dtype: Directory
        info:
          output xradio zarr dataset
        policies:
          positional: true
        mkdir: false
