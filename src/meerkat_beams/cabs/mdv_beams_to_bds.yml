cabs:
  mdv_beams_to_bds:
    flavour: python
    command: meerkat_beams.core.mdv_beams_to_bds.mdv_beams_to_bds
    name: mdv_beams_to_bds
    info:
      Converts MdV-format primary beams to a beam dataset (BDS)
    image: ghcr.io/landmanbester/meerkat-beams:0.0.1
    inputs:
      mdv-beams:
        info:
          input MdV beams npz file (see https://doi.org/10.48479/wdb0-h061)
        dtype: File
        required: true
        policies:
          positional: true
        metavar: MDV_FILE
      compress:
        info:
          apply Delta+Blosc compression to zarr output
        dtype: bool
        default: false
    outputs:
      bds:
        dtype: Directory
        info:
          output beam dataset (BDS) file
        policies:
          positional: true
        mkdir: false
