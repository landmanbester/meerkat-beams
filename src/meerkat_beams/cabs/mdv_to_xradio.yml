cabs:
  mdv_to_xradio:
    flavour: python
    command: meerkat_beams.core.mdv_to_xradio.mdv_to_xradio
    name: mdv-to-xradio
    info:
      Converts raw MdV beam npz to an xradio-compatible zarr image
    image: ghcr.io/landmanbester/meerkat-beams:dev001
    inputs:
      npz-path:
        info:
          input MdV beam npz file
        dtype: File
        required: true
        policies:
          positional: true
        metavar: NPZ_PATH
      antenna:
        info:
          antenna index (-1 = array_average)
        dtype: int
        default: '-1'
      jones:
        info:
          Jones element (HH, HV, VH, VV)
        default: HH
      part:
        info:
          component to render (real, imag, abs, phase)
        default: real
      output-var:
        info:
          data variable name
        default: SKY
      chunks-freq:
        info:
          zarr chunk size along frequency axis
        dtype: int
        default: 64
      chunks-x:
        info:
          zarr chunk size along l axis
        dtype: int
        default: 128
      chunks-y:
        info:
          zarr chunk size along m axis
        dtype: int
        default: 128
      compress:
        info:
          apply Delta+Blosc compression to zarr output
        dtype: bool
        default: false
    outputs:
      output:
        dtype: Directory
        info:
          output xradio zarr dataset
        policies:
          positional: true
        mkdir: false
