cabs:
  mdv-to-xradio:
    _use: lib.misc.suricat.cabs
    command: suricat.xradio_util.mdv_to_xradio
    info: Converts raw MdV beam npz to an xradio-compatible zarr image
    flavour: python
    inputs:
      npz-path:
        dtype: File
        metavar: NPZ_PATH
        info: input MdV beam npz file
        required: true
        policies:
          positional: true
      antenna:
        dtype: int
        info: antenna index (-1 = array_average)
        default: -1
      jones:
        dtype: str
        info: Jones element (HH, HV, VH, VV)
        default: HH
      part:
        dtype: str
        info: component to render (real, imag, abs, phase)
        default: real
      output-var:
        dtype: str
        info: data variable name
        default: SKY
      chunks-freq:
        dtype: int
        info: zarr chunk size along frequency axis
        default: 64
      chunks-x:
        dtype: int
        info: zarr chunk size along l axis
        default: 128
      chunks-y:
        dtype: int
        info: zarr chunk size along m axis
        default: 128
      compress:
        dtype: bool
        info: apply Delta+Blosc compression to zarr output
        default: false
    outputs:
      output:
        dtype: Directory
        metavar: OUTPUT
        info: output xradio zarr dataset
        mkdir: false
        policies:
          positional: true
