name: Publish Container

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

# Cab generation is handled by pre-commit hooks locally.
# This workflow only builds and pushes container images, which stimela and the
# lightweight install pull (the image is named in the cab definitions).
#
# Images are published when a PR is merged into main (`latest`), on a version
# tag (the PEP 440 version), and on a manual run. Open PRs do not publish.
#
# To let users test a feature branch, run this workflow by hand on that branch:
#
#   gh workflow run publish-container.yml --ref <branch>
#
# which publishes ghcr.io/<owner>/<repo>:<branch>, with `/` in the branch name
# replaced by `-` (feat/foo -> feat-foo). A manual run on main republishes
# `latest`.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The image is published for linux/amd64 and linux/arm64 under one tag
      # (#43). The arm64 half is built under QEMU emulation: every dependency
      # ships an aarch64 wheel, so nothing is compiled and emulation is cheap
      # enough not to need a second runner and a manifest merge.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for container
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For version tags: v0.2.0 -> 0.2.0, v0.2.0rc1 -> 0.2.0rc1
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            # For manual runs on a feature branch: the sanitised branch name
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
            # For main branch: use 'latest'
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
