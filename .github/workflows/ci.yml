name: CI

# Pull requests into main or a long-lived dev-* integration branch, plus the
# cron below (the only run that tests main itself) and manual runs. A merge is
# not re-tested: its PR already passed. A PR into any other branch (e.g. a
# stacked PR) runs only on demand:
#   gh workflow run ci.yml --ref <branch>
# The tbump release commit goes straight to main and is tested by publish.yml.
on:
  pull_request:
    branches: [ main, 'dev-*' ]
  schedule:
    - cron: '30 2 * * 1,4' # Every Monday and Thursday @ 2h30am UTC
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # setup-uv owns the uv cache. Its key already covers platform, resolved
      # Python version, and hashes of uv.lock / pyproject.toml, so a separate
      # actions/cache step on ~/.cache/uv would just duplicate it.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Lint code
        run: uv run ruff check .

  test:
    # Spelled out so the x86 jobs keep their names ("Tests (3.13)") now that
    # the matrix has a second axis; branch protection refers to them by name.
    name: Tests (${{ matrix.python-version }}${{ matrix.arch-label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.10 is deliberately absent: it is supported only for the
        # lightweight base install (see the lightweight job below), not for
        # the [full] scientific stack the tests exercise. Do not add it back.
        # Oldest and newest Python the full install supports: code that passes
        # both rarely breaks in between.
        python-version: ["3.11", "3.13"]
        include:
          # One arm64 job, not a second matrix: it is there to catch a
          # dependency without an aarch64 wheel or an architecture-dependent
          # numerical difference, which one Python version is enough for (#43).
          - os: ubuntu-24.04-arm
            python-version: "3.13"
            arch-label: ", arm64"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group test --extra full

      - name: Smoke test CLI
        run: uv run mbeams --help

      - name: Run tests
        # MBEAMS_OFFLINE=1 skips the L-band cache warm-up (a Google Drive
        # download) so CI stays hermetic; integration tests needing data skip.
        env:
          MBEAMS_OFFLINE: "1"
        run: uv run pytest -v

  # The lock pins xarray and zarr, but users resolve freshly, and xarray
  # releases have broken our zarr I/O before (#44). This job upgrades both to
  # the newest releases so the next such break shows up here first.
  latest:
    name: Tests (newest xarray + zarr)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies with the newest xarray and zarr
        run: |
          uv sync --group test --extra full
          # --upgrade-package, not --upgrade: only xarray and zarr move past the
          # lock, so a failure here is theirs and not an unrelated transitive bump.
          uv pip install --upgrade-package xarray --upgrade-package zarr xarray zarr
          uv pip check
          uv run --no-sync python -c "import xarray, zarr; print('xarray', xarray.__version__, 'zarr', zarr.__version__)"

      - name: Run tests
        env:
          MBEAMS_OFFLINE: "1"
        # --no-sync: a plain `uv run` would re-sync the lock and restore the pinned versions.
        run: uv run --no-sync pytest -v

  # The declared xarray floor, with everything else as locked (in particular
  # pandas 3). A floor that has stopped working is invisible to the jobs above,
  # which run the locked or the newest xarray; this is what a downstream
  # environment holding xarray back gets (#47). 2025.8.0 is the floor in
  # pyproject.toml's [full] extra; keep the two in step.
  floors:
    name: Tests (xarray floor)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies with xarray at its floor
        run: |
          uv sync --group test --extra full
          uv pip install 'xarray==2025.8.0'
          uv pip check
          uv run --no-sync python -c "import pandas, xarray; print('xarray', xarray.__version__, 'pandas', pandas.__version__); assert xarray.__version__ == '2025.8.0'; assert int(pandas.__version__.split('.')[0]) >= 3, pandas.__version__"

      - name: Run tests
        env:
          MBEAMS_OFFLINE: "1"
        # --no-sync: a plain `uv run` would re-sync the lock and restore the locked xarray.
        run: uv run --no-sync pytest -v

  # zarr is unpinned (the lock resolves zarr 3, which the test matrix above
  # covers), but downstream applications may still hold zarr-python 2. Our
  # writers emit zarr v2 under either major version; this job pins the zarr 2
  # half of that guarantee. xarray dropped zarr-python 2 in 2026.9 (#44), so
  # the job resolves the newest xarray below that cap rather than the locked
  # one, which is what a zarr 2 user pinning xarray<2026.9 gets.
  zarr2:
    name: Tests (zarr-python 2)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies with zarr<3
        run: |
          uv sync --group test --extra full
          # 2026.9 is utils.XARRAY_ZARR2_CAP; keep the two in step.
          uv pip install --upgrade-package xarray --upgrade-package zarr 'zarr<3' 'xarray<2026.9'
          uv pip check
          uv run --no-sync python -c "import xarray, zarr; print('xarray', xarray.__version__); assert zarr.__version__.startswith('2.'), zarr.__version__"

      - name: Run tests
        env:
          MBEAMS_OFFLINE: "1"
        # --no-sync: a plain `uv run` would re-sync the lock and restore zarr 3.
        run: uv run --no-sync pytest -v

  # Python 3.10 supports ONLY the lightweight base install: the CLI plus
  # hip-cargo container dispatch (--backend docker/podman/...), no [full]
  # scientific stack. This job pins that guarantee; the test matrix above
  # starts at 3.11.
  lightweight:
    name: Lightweight install (3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install base package (no extras)
        run: |
          uv venv --python 3.10
          uv pip install .

      - name: Smoke test CLI
        run: |
          uv run --no-sync mbeams --help
          uv run --no-sync mbeams bds-to-fits --help
