name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '30 2 * * 1,4' # Every Monday and Thursday @ 2h30am UTC
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check for skip checks
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          MSG=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA --jq '.commit.message')
          if echo "$MSG" | grep -qF '[skip checks]'; then
            echo "SKIP_CHECKS=true" >> "$GITHUB_ENV"
            echo "Skipping checks because [skip checks] was found in the commit message."
          fi

      - name: Check out code
        if: env.SKIP_CHECKS != 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: env.SKIP_CHECKS != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up uv
        if: env.SKIP_CHECKS != 'true'
        uses: astral-sh/setup-uv@v9

      - name: Cache uv dependencies
        if: env.SKIP_CHECKS != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        if: env.SKIP_CHECKS != 'true'
        run: uv sync --group dev

      - name: Check code formatting
        if: env.SKIP_CHECKS != 'true'
        run: uv run ruff format --check .

      - name: Lint code
        if: env.SKIP_CHECKS != 'true'
        run: uv run ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is deliberately absent: it is supported only for the
        # lightweight base install (see the lightweight job below), not for
        # the [full] scientific stack the tests exercise. Do not add it back.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check for skip checks
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          MSG=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA --jq '.commit.message')
          if echo "$MSG" | grep -qF '[skip checks]'; then
            echo "SKIP_CHECKS=true" >> "$GITHUB_ENV"
            echo "Skipping checks because [skip checks] was found in the commit message."
          fi

      - name: Check out code
        if: env.SKIP_CHECKS != 'true'
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        if: env.SKIP_CHECKS != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        if: env.SKIP_CHECKS != 'true'
        uses: astral-sh/setup-uv@v9

      - name: Cache uv dependencies
        if: env.SKIP_CHECKS != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-py${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Install dependencies
        if: env.SKIP_CHECKS != 'true'
        run: uv sync --group test --extra full

      - name: Smoke test CLI
        if: env.SKIP_CHECKS != 'true'
        run: uv run mbeams --help

      - name: Run tests
        if: env.SKIP_CHECKS != 'true'
        # MBEAMS_OFFLINE=1 skips the L-band cache warm-up (a Google Drive
        # download) so CI stays hermetic; integration tests needing data skip.
        env:
          MBEAMS_OFFLINE: "1"
        run: uv run pytest -v

  # Python 3.10 supports ONLY the lightweight base install: the CLI plus
  # hip-cargo container dispatch (--backend docker/podman/...), no [full]
  # scientific stack. This job pins that guarantee; the test matrix above
  # starts at 3.11.
  lightweight:
    name: Lightweight install (3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9

      - name: Install base package (no extras)
        run: |
          uv venv --python 3.10
          uv pip install .

      - name: Smoke test CLI
        run: |
          uv run --no-sync mbeams --help
          uv run --no-sync mbeams download-mdv-beams --help
